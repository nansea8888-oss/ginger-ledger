<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>登录测试</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#2F5D50;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
h1{font-size:22px;margin-bottom:8px}
p{font-size:13px;color:#A8C4BA;margin-bottom:24px;text-align:center;line-height:1.6}
input{width:100%;max-width:300px;padding:15px;border:0;border-radius:12px;font-size:17px;text-align:center;letter-spacing:2px;margin-bottom:12px}
button{width:100%;max-width:300px;padding:15px;border:0;border-radius:12px;background:#FFC94D;color:#2F5D50;font-size:16px;font-weight:700}
#log{margin-top:22px;font-size:11px;color:#9FBDB2;white-space:pre-wrap;text-align:left;width:100%;max-width:340px;line-height:1.7}
.ok{color:#8FE3A8}.err{color:#FFB3A7}
</style>
</head>
<body>
<h1>生姜收购台账</h1>
<p>输入邀请码登录</p>
<input id="code" placeholder="GL-XXXX" value="GL-TEST01">
<button onclick="doLogin()">登 录</button>
<div id="log"></div>
<script src="cloudbase.bundle.js"></script>
<script>
const API = 'https://head-crab-d1g485if3fb037f2a.api.tcloudbasegateway.com/v1/rdb/rest';
let app = null, token = null;
const logEl = document.getElementById('log');
function log(s, cls){ logEl.innerHTML += '<span class="' + (cls||'') + '">' + s + '</span>\n'; }

async function initSdk(){
  if (app) return;
  const cb = cloudbase.default || cloudbase;
  app = cb.init({ env: 'head-crab-d1g485if3fb037f2a' });
  const auth = app.auth({ persistence: 'local' });
  await auth.signInAnonymously();
  const t = await auth.getAccessToken();
  token = typeof t === 'string' ? t : (t && t.accessToken);
  log('✅ SDK 就绪，已有 token');
}

async function api(path, opt){
  opt = opt || {};
  opt.headers = Object.assign({
    'Accept': 'application/json',
    'Content-Type': 'application/json',
    'Authorization': 'Bearer ' + token
  }, opt.headers || {});
  const r = await fetch(API + path, opt);
  const text = await r.text();
  if (!r.ok) throw new Error(r.status + ' ' + text.slice(0, 200));
  return text ? JSON.parse(text) : null;
}

async function doLogin(){
  logEl.innerHTML = '';
  const code = document.getElementById('code').value.trim().toUpperCase();
  if (!code) { log('请输入邀请码', 'err'); return; }
  try {
    await initSdk();
    log('查询邀请码：' + code);
    const rows = await api('/users?invite_code=eq.' + encodeURIComponent(code) + '&limit=1');
    log('返回：' + JSON.stringify(rows));
    if (!rows || !rows.length) { log('❌ 邀请码无效', 'err'); return; }
    const u = rows[0];
    if (u.status !== 'active') { log('❌ 账号已停用', 'err'); return; }
    localStorage.setItem('gl_user', JSON.stringify(u));
    log('✅ 登录成功：' + u.name, 'ok');
    log('用户ID：' + u.id + ' / 类型：' + u.type);
  } catch (e) {
    log('❌ ' + (e.message || e), 'err');
  }
}
if (location.search.includes('auto')) setTimeout(doLogin, 800);
</script>
</body>
</html>
