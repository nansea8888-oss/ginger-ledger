<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<meta name="theme-color" content="#2F5D50">

<link rel="apple-touch-icon" href="icon-180.png">
<title>生姜收购台账</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{width:100%;overflow-x:hidden}
body{width:100%;max-width:100vw;overflow-x:hidden;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;background:#F4F6F5;color:#1F2A24;font-size:16px;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
header,nav,main,section,.card,.row,.calc,.sum,.grp,#listBox,#cusBox{max-width:100%}
input,select,button{max-width:100%}
header{background:#2F5D50;color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 14px;font-size:18px;font-weight:600;position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;overflow:hidden}
header>span:first-child{white-space:nowrap}
header .sub{font-size:11.5px;font-weight:400;opacity:.8;flex-shrink:0;margin-left:8px}
nav{display:flex;background:#fff;border-bottom:1px solid #E3E8E5;position:sticky;top:calc(50px + env(safe-area-inset-top));z-index:9}
nav button{flex:1 1 0;min-width:0;padding:12px 0;border:0;background:none;font-size:15px;color:#6B7C74;font-family:inherit;border-bottom:3px solid transparent}
nav button.on{color:#2F5D50;font-weight:600;border-bottom-color:#2F5D50}
main{padding:12px;max-width:100%;overflow-x:hidden}
.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.card h3{font-size:14px;color:#5A6B63;font-weight:600;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.row{display:flex;gap:10px;margin-bottom:10px}
.row>*{flex:1 1 0;min-width:0}
label{display:block;font-size:12px;color:#7A8A82;margin-bottom:4px}
input,select{width:100%;min-width:0;max-width:100%;padding:11px 10px;border:1px solid #D8E0DB;border-radius:8px;font-size:16px;font-family:inherit;background:#fff;color:#1F2A24}
input:focus,select:focus{outline:none;border-color:#2F5D50;background:#F8FBF9}
.calc{background:#F7FAF8;border:1px dashed #C9D8D0;border-radius:10px;padding:10px;margin-bottom:12px}
.calc .line{display:flex;justify-content:space-between;padding:5px 0;font-size:14px;color:#5A6B63}
.calc .line b{color:#1F2A24;font-weight:600}
.calc .line .hint{font-style:normal;font-size:11.5px;color:#9AA8A1;margin-left:5px}
.calc .big{border-top:1px solid #DCE6E0;margin-top:6px;padding-top:8px;font-size:16px}
.calc .big b{color:#C0392B;font-size:20px}
.btn{width:100%;padding:15px;border:0;border-radius:10px;background:#2F5D50;color:#fff;font-size:17px;font-weight:600;font-family:inherit;margin-top:4px}
.btn:active{background:#24483E}
.btn.ghost{background:#EAF1ED;color:#2F5D50;font-size:15px;padding:12px;margin-top:8px}
.grp{background:#fff;border-radius:12px;margin-bottom:10px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.grp .gh{padding:13px 14px;background:#EAF1ED;display:flex;justify-content:space-between;align-items:center;font-weight:600;color:#2F5D50;font-size:15px;gap:8px}
.grp .gh .g1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grp .gh .g2{font-size:12px;font-weight:400;color:#5A6B63;text-align:right;white-space:nowrap;flex-shrink:0}
.item{border-top:1px solid #F0F4F2}
.row-main{padding:13px 14px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;cursor:pointer}
.row-main:active{background:#F5F9F7}
.li-l{flex:1;min-width:0}
.li-name{font-size:16.5px;font-weight:600;color:#1F2A24;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li-m1{font-size:12.5px;color:#7A8A82;margin-bottom:3px;line-height:1.5}
.li-m2{font-size:12.5px;color:#7A8A82;line-height:1.5}
.li-m2 b{color:#1F2A24;font-weight:600}
.li-r{flex-shrink:0;text-align:right;display:flex;flex-direction:column;align-items:flex-end}
.li-r b{font-size:17px;font-weight:700;color:#C0392B;line-height:1.2}
.li-r small{font-size:11px;color:#9AA8A1;margin-top:2px}
.li-arrow{font-size:10px;color:#B8C4BE;margin-top:5px;transition:transform .15s;display:inline-block}
.item.open .li-arrow{transform:rotate(180deg)}
.expand{display:none;padding:0 14px 14px}
.item.open .expand{display:block}
.dl{background:#FAFCFB;border:1px solid #E9F0EC;border-radius:10px;padding:2px 13px;margin-bottom:8px}
.dl .r{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:8px 0;border-bottom:1px solid #EFF4F1;font-size:13.5px;line-height:1.4}
.dl .r:last-child{border-bottom:0}
.dl .r span{color:#7A8A82;flex-shrink:0}
.dl .r b{font-weight:600;color:#1F2A24;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.dl.amount{background:#FDFCFB;border-color:#F0E6E0}
.dl.amount .r span{color:#8A7A72}
.dl.amount .r b{color:#8C4A3C}
.dl .r.total{padding:12px 0 13px;border-bottom:0;margin-top:1px;border-top:1px solid #E2D5CE}
.dl .r.total span{color:#1F2A24;font-weight:600;font-size:14.5px}
.dl .r.total b{color:#C0392B;font-size:21px;letter-spacing:-.3px}
.del-btn{width:100%;margin-top:2px;padding:11px;border:0;border-radius:9px;background:#FDEDEC;color:#C0392B;font-size:14px;font-weight:600;font-family:inherit}
.li-m1,.li-m2,.li-r b{font-variant-numeric:tabular-nums}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.sum .box{background:#fff;border-radius:12px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.sum .box .k{font-size:12px;color:#7A8A82;margin-bottom:6px}
.sum .box .v{font-size:19px;font-weight:700;color:#2F5D50}
.sum .box .v small{font-size:12px;font-weight:400;color:#7A8A82}
.sum .box em{font-style:normal;font-size:10.5px;color:#9AA8A1}
.sum .box.wide{grid-column:1/-1;background:#2F5D50}
.sum .box.wide .k{color:#AECBBF}
.sum .box.wide .v{color:#fff;font-size:26px}
.item .m2{font-size:12px;color:#5A6B63;margin-top:3px}
.empty{text-align:center;color:#9AA8A1;padding:50px 20px;font-size:14px;line-height:1.8}
.store-info{background:#FAFCFB;border:1px solid #E9F0EC;border-radius:10px;padding:2px 13px;margin-bottom:12px}
.si-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:8px 0;border-bottom:1px solid #EFF4F1;font-size:13.5px}
.si-row:last-child{border-bottom:0}
.si-row span{color:#7A8A82}
.si-row b{color:#1F2A24;font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.tip{font-size:12px;color:#9AA8A1;text-align:center;padding:14px 10px;line-height:1.7}
.guide{position:fixed;top:0;left:0;right:0;bottom:0;z-index:9999;background:rgba(10,20,15,.93);display:flex;align-items:center;justify-content:center;padding:max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));overflow-y:auto;-webkit-overflow-scrolling:touch}
.gbox{background:#fff;border-radius:20px;width:100%;max-width:min(340px, 88vw);padding:26px 20px 18px;text-align:center;margin:auto;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.gicon{font-size:34px;line-height:1;margin-bottom:12px}
.gbox h2{font-size:clamp(17px, 4.6vw, 19px);color:#1F2A24;margin-bottom:8px;line-height:1.35;font-weight:700}
.gsub{font-size:clamp(12.5px, 3.4vw, 13.5px);color:#7A8A82;line-height:1.55;margin-bottom:18px}
.gsteps{list-style:none;text-align:left;margin:0 0 20px;padding:0;counter-reset:s}
.gsteps li{counter-increment:s;position:relative;padding:8px 0 8px 34px;font-size:clamp(14px, 3.9vw, 15px);line-height:1.5;color:#1F2A24}
.gsteps li::before{content:counter(s);position:absolute;left:0;top:8px;width:23px;height:23px;border-radius:50%;background:#2F5D50;color:#fff;font-size:12.5px;display:flex;align-items:center;justify-content:center;font-weight:600}
.gbtn{display:block;width:100%;padding:14px;border:0;border-radius:11px;background:#2F5D50;color:#fff;font-size:clamp(15px,4vw,16px);font-weight:600;font-family:inherit;margin-bottom:8px}
.gbtn:active{background:#24483E}
.gbtn2{display:block;width:100%;padding:10px;border:0;border-radius:9px;background:none;color:#9AA8A1;font-size:13px;font-family:inherit}
.ga{position:fixed;font-size:clamp(34px,9vw,44px);color:#fff;line-height:1;z-index:10000;text-shadow:0 3px 14px rgba(0,0,0,.7);animation:blink 1.1s infinite}
.ga.tr{top:calc(6px + env(safe-area-inset-top));right:14px}
.ga.bc{bottom:calc(8px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%)}
.ga.br{bottom:calc(8px + env(safe-area-inset-bottom));right:20px}
@keyframes blink{0%,100%{opacity:.35}50%{opacity:1}}
.hide{display:none}
</style>
</head>
<body>

<header>
  <span>生姜收购台账</span>
  <span class="sub" id="today"></span>
</header>

<nav>
  <button class="on" data-tab="in">录入</button>
  <button data-tab="list">明细</button>
  <button data-tab="sum">汇总</button>
</nav>

<main>
  <!-- 录入 -->
  <section id="tab-in">
    <div class="card">
      <h3>客户与批次</h3>
      <div class="row">
        <div>
          <label>客户（买家）</label>
          <input id="customer" list="dl-cus" placeholder="选或直接打">
          <datalist id="dl-cus"></datalist>
        </div>
        <div>
          <label>批号</label>
          <input id="lot" placeholder="20250217-01">
        </div>
      </div>
      <div class="row">
        <div>
          <label>车牌号</label>
          <input id="plate" placeholder="鲁A12345">
        </div>
        <div>
          <label>收购日期</label>
          <input id="date" type="date">
        </div>
      </div>
    </div>

    <div class="card">
      <h3>货主（卖家）</h3>
      <div class="row">
        <div>
          <label>货主</label>
          <input id="owner" list="dl-own" placeholder="选或直接打">
          <datalist id="dl-own"></datalist>
        </div>
        <div>
          <label>电话</label>
          <input id="tel" type="tel" inputmode="tel" placeholder="手机号">
        </div>
      </div>
      <div>
        <label>基地</label>
        <input id="base" placeholder="王家村基地">
      </div>
    </div>

    <div class="card">
      <h3>计量与价格</h3>
      <div class="row">
        <div>
          <label>件数</label>
          <input id="jian" type="number" inputmode="decimal" placeholder="0">
        </div>
        <div>
          <label>单件斤数</label>
          <input id="per" type="number" inputmode="decimal" placeholder="0">
        </div>
      </div>
      <div class="row">
        <div>
          <label>扣土率（%）</label>
          <input id="soil" type="number" inputmode="decimal" placeholder="10">
        </div>
        <div>
          <label>单价（元/斤）</label>
          <input id="price" type="number" inputmode="decimal" placeholder="0.00">
        </div>
      </div>
      <div>
        <label>代办费（元/斤）</label>
        <input id="fee" type="number" inputmode="decimal" placeholder="0.05">
      </div>

      <div class="calc" style="margin-top:12px;margin-bottom:0">
        <div class="line"><span>总斤数</span><b id="c1">0</b></div>
        <div class="line"><span>扣土量</span><b id="c2">0</b></div>
        <div class="line"><span>净总斤数</span><b id="c3">0</b></div>
        <div class="line"><span>总价 <i class="hint">付货主</i></span><b id="c4">0</b></div>
        <div class="line"><span>代办总价 <i class="hint">付代办</i></span><b id="c5">0</b></div>
        <div class="line big"><span>实际总价 <i class="hint">总款</i></span><b id="c6">0</b></div>
      </div>

      <button class="btn" onclick="saveRec()">保 存</button>
    </div>

    <p class="tip">数据存在这台手机的浏览器里。换手机或清缓存会丢，建议定期用「导出」。 </p>
  </section>

  <!-- 明细 -->
  <section id="tab-list" class="hide">
    <div id="listBox"></div>
  </section>

  <!-- 汇总 -->
  <section id="tab-sum" class="hide">
    <div class="sum" id="sumBox"></div>
    <div class="card">
      <h3>按客户汇总</h3>
      <div id="cusBox"></div>
    </div>

    <div class="card">
      <h3>数据存储</h3>
      <div id="storeInfo" class="store-info"></div>
      <button class="btn ghost" onclick="exportJSON()">导出备份（JSON · 完整数据）</button>
      <label class="btn ghost" style="display:block;text-align:center">
        导入备份（JSON · 合并）
        <input type="file" accept=".json,application/json" onchange="importJSON(this.files[0]); this.value='';" style="display:none">
      </label>
      <button class="btn ghost" onclick="exportCSV()">导出 Excel（CSV · 给会计）</button>
    </div>

    <div class="card">
      <h3>录入人</h3>
      <input id="opName" placeholder="填你的名字，例如：老王" onchange="saveOperator()">
      <p class="tip" style="text-align:left;padding:8px 0 0">填了以后每笔账都会记下是谁录的，以后多人用能分清。</p>
    </div>

    <button class="btn ghost" onclick="clearAll()" style="color:#C0392B">清空全部数据</button>
  </section>
</main>

<div id="guide" class="guide">
  <span class="ga" id="ga">↗</span>
  <div class="gbox">
    <div class="gicon">📱</div>
    <h2 id="gt">把台账装到手机桌面</h2>
    <div class="gsub" id="gsub"></div>
    <ol class="gsteps" id="gs"></ol>
    <button class="gbtn" id="gmain">立即安装</button>
    <button class="gbtn2" id="gdone">我已经装好了，进入台账</button>
  </div>
</div>

<script>
const KEY = 'ginger_ledger_v1';   // 旧键，仅用于一次性迁移
const APP_VERSION = '1.0.0';
let data = [];

/* 设备标识 & 录入人（为将来上云和权限预留） */
var deviceId = localStorage.getItem('gl_device') || '';
if(!deviceId){
  deviceId = 'D' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  localStorage.setItem('gl_device', deviceId);
}
var operator = localStorage.getItem('gl_operator') || '';

function uuid(){
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c){
    var r = Math.random() * 16 | 0;
    return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
  });
}

/* ---------- IndexedDB 本地库（主存储） ---------- */
var DB = (function(){
  var NAME = 'ginger_ledger', VER = 1, p = null;
  function open(){
    if(p) return p;
    p = new Promise(function(res, rej){
      var req = indexedDB.open(NAME, VER);
      req.onupgradeneeded = function(e){
        var db = e.target.result;
        if(!db.objectStoreNames.contains('records')){
          var st = db.createObjectStore('records', {keyPath: 'uuid'});
          st.createIndex('date', 'date', {unique: false});
          st.createIndex('createdAt', 'createdAt', {unique: false});
        }
      };
      req.onsuccess = function(e){ res(e.target.result); };
      req.onerror = function(e){ rej(e.target.error); };
    });
    return p;
  }
  function tx(mode, fn){
    return open().then(function(db){
      return new Promise(function(res, rej){
        var t = db.transaction('records', mode);
        var req = fn(t.objectStore('records'));
        t.oncomplete = function(){ res(req ? req.result : undefined); };
        t.onerror = function(){ rej(t.error); };
        t.onabort = function(){ rej(t.error); };
      });
    });
  }
  return {
    all: function(){ return tx('readonly', function(st){ return st.getAll(); }); },
    put: function(r){ return tx('readwrite', function(st){ return st.put(r); }); },
    putMany: function(list){ return tx('readwrite', function(st){ list.forEach(function(r){ st.put(r); }); }); },
    del: function(k){ return tx('readwrite', function(st){ return st.delete(k); }); },
    clear: function(){ return tx('readwrite', function(st){ return st.clear(); }); }
  };
})();

/* 把老版本存在 localStorage 的数据搬进来（只搬一次） */
function migrate(){
  var raw = null;
  try{ raw = localStorage.getItem(KEY); }catch(e){ return Promise.resolve(0); }
  if(!raw) return Promise.resolve(0);
  var arr = [];
  try{ arr = JSON.parse(raw) || []; }catch(e){ arr = []; }
  if(!arr.length){ try{ localStorage.removeItem(KEY); }catch(e){} return Promise.resolve(0); }
  var now = Date.now();
  arr.forEach(function(r, i){
    if(!r.uuid) r.uuid = 'legacy-' + (r.id || (now + i)) + '-' + i;
    r.createdAt = r.createdAt || r.id || (now + i);
    r.updatedAt = r.updatedAt || now;
    r.deviceId = r.deviceId || deviceId;
    r.operator = r.operator || '';
    r.deleted = false;
    if(typeof r.amount === 'number' && typeof r.feeTotal === 'number'){
      r.actual = r.amount + r.feeTotal;
    }
  });
  return DB.putMany(arr).then(function(){
    try{ localStorage.removeItem(KEY); }catch(e){}
    return arr.length;
  });
}

function n(id){ const v = parseFloat(document.getElementById(id).value); return isNaN(v) ? 0 : v; }
function s(id){ return (document.getElementById(id).value || '').trim(); }
function fmt(x, d){
  if(d === undefined) d = 2;
  var f = Math.pow(10, d);
  var s = (Math.round(x * f) / f).toFixed(d);
  var p = s.split('.');
  p[0] = p[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return p.join('.');
}

function normalizeData(){
  data = (data || []).filter(function(r){ return !r.deleted; });
  data.forEach(function(r){
    if(typeof r.amount === 'number' && typeof r.feeTotal === 'number'){
      r.actual = r.amount + r.feeTotal;
    }
  });
  data.sort(function(a, b){ return (b.createdAt || 0) - (a.createdAt || 0); });
}

function load(cb){
  var done = false;
  function finish(){
    if(done) return;
    done = true;
    if(cb) cb();
  }
  function fallback(){
    try{ data = JSON.parse(localStorage.getItem(KEY) || '[]'); }catch(e){ data = []; }
    normalizeData();
    finish();
  }
  // 浏览器不支持 IndexedDB：直接走老路
  if(!window.indexedDB){ fallback(); return; }

  // 兜底：3 秒内无论如何都要渲染，绝不白屏
  var timer = setTimeout(function(){ normalizeData(); finish(); }, 3000);

  migrate().catch(function(){}).then(function(){
    return DB.all();
  }).then(function(list){
    clearTimeout(timer);
    data = list || [];
    normalizeData();
    finish();
  }).catch(function(){
    clearTimeout(timer);
    fallback();
  });
}

function recalc(){
  const jian=n('jian'), per=n('per'), soil=n('soil')/100, price=n('price'), fee=n('fee');
  const total = jian*per;
  const soilQty = total*soil;
  const net = total-soilQty;
  const amount = net*price;          // 总价：付给货主的钱
  const feeTotal = net*fee;          // 代办总价：付给代办的钱
  const actual = amount + feeTotal;  // 实际总价：老板要掏的总款
  document.getElementById('c1').textContent = fmt(total);
  document.getElementById('c2').textContent = fmt(soilQty);
  document.getElementById('c3').textContent = fmt(net);
  document.getElementById('c4').textContent = fmt(amount);
  document.getElementById('c5').textContent = fmt(feeTotal);
  document.getElementById('c6').textContent = '¥ ' + fmt(actual);
}

['jian','per','soil','price','fee'].forEach(function(id){
  document.getElementById(id).addEventListener('input', recalc);
});

function saveRec(){
  const customer = s('customer');
  const owner = s('owner');
  const jian = n('jian'), per = n('per');
  if(!customer){ alert('请填写客户（买家）'); return; }
  if(!owner){ alert('请填写货主（卖家）'); return; }
  if(jian<=0 || per<=0){ alert('件数和单件斤数要大于 0'); return; }

  const soil = n('soil')/100, price = n('price'), fee = n('fee');
  const total = jian*per;
  const soilQty = total*soil;
  const net = total-soilQty;

  var now = Date.now();
  var rec = {
    uuid: uuid(),
    date: s('date') || new Date().toISOString().slice(0,10),
    customer: customer, lot: s('lot'), plate: s('plate'),
    owner: owner, tel: s('tel'), base: s('base'),
    jian: jian, per: per, soil: soil,
    price: price, fee: fee,
    total: total, soilQty: soilQty, net: net,
    amount: net*price, feeTotal: net*fee, actual: net*price + net*fee,
    operator: operator || '',
    deviceId: deviceId,
    createdAt: now,
    updatedAt: now,
    deleted: false
  };
  data.unshift(rec);
  DB.put(rec).catch(function(){});

  ['lot','plate','owner','tel','base','jian','per','price'].forEach(function(id){
    document.getElementById(id).value = '';
  });
  recalc();
  render();
  alert('已保存 ✓');
  showTab('list');
}

function render(){
  // 客户 / 货主联想
  const cusSet = {}, ownSet = {};
  data.forEach(function(r){ cusSet[r.customer]=1; ownSet[r.owner]=1; });
  document.getElementById('dl-cus').innerHTML =
    Object.keys(cusSet).map(function(k){ return '<option value="'+k+'">'; }).join('');
  document.getElementById('dl-own').innerHTML =
    Object.keys(ownSet).map(function(k){ return '<option value="'+k+'">'; }).join('');

  // 明细（按客户分组）
  const box = document.getElementById('listBox');
  if(!data.length){
    box.innerHTML = '<div class="empty">还没有记录<br>去「录入」填第一笔吧</div>';
  }else{
    const groups = {};
    data.forEach(function(r){ (groups[r.customer] = groups[r.customer] || []).push(r); });
    let html = '';
    Object.keys(groups).forEach(function(cus){
      const arr = groups[cus];
      const net = arr.reduce(function(a,b){ return a+b.net; }, 0);
      const act = arr.reduce(function(a,b){ return a+b.actual; }, 0);
      html += '<div class="grp"><div class="gh"><span class="g1">'+cus+'</span>'+
              '<span class="g2">'+arr.length+' 笔 · '+fmt(net,0)+' 斤 · 总款 ¥'+fmt(act,0)+'</span></div>';
      arr.forEach(function(r){
        var total = (typeof r.total === 'number') ? r.total : (r.jian * r.per);
        var soilQty = (typeof r.soilQty === 'number') ? r.soilQty : (total * (r.soil || 0));
        var opened = (openId === r.uuid);
        html += '<div class="item' + (opened ? ' open' : '') + '" data-id="' + r.uuid + '">' +
          '<div class="row-main" onclick="toggleItem(this)">' +
            '<div class="li-l">' +
              '<div class="li-name">'+r.owner+'</div>' +
              '<div class="li-m1">'+(r.date||'—')+'　'+fmt(total,0)+' 斤　单价 '+fmt(r.price,2)+'</div>' +
              '<div class="li-m2">总价 <b>'+fmt(r.amount,0)+'</b>　代办 <b>'+fmt(r.feeTotal,0)+'</b></div>' +
            '</div>' +
            '<div class="li-r">' +
              '<b>¥'+fmt(r.actual,0)+'</b>' +
              '<small>总款</small>' +
              '<span class="li-arrow">▼</span>' +
            '</div>' +
          '</div>' +
          '<div class="expand">' +
            '<div class="dl">' +
              '<div class="r"><span>件数</span><b>'+fmt(r.jian,0)+' 件</b></div>' +
              '<div class="r"><span>单件斤数</span><b>'+fmt(r.per,2)+' 斤</b></div>' +
              '<div class="r"><span>总斤数</span><b>'+fmt(total,2)+' 斤</b></div>' +
              '<div class="r"><span>扣土率</span><b>'+((r.soil||0)*100).toFixed(1)+' %</b></div>' +
              '<div class="r"><span>扣土量</span><b>'+fmt(soilQty,2)+' 斤</b></div>' +
              '<div class="r"><span>净总斤数</span><b>'+fmt(r.net,2)+' 斤</b></div>' +
            '</div>' +
            '<div class="dl amount">' +
              '<div class="r"><span>单价（元/斤）</span><b>'+fmt(r.price,2)+'</b></div>' +
              '<div class="r"><span>总价 · 付货主</span><b>¥ '+fmt(r.amount,2)+'</b></div>' +
              '<div class="r"><span>代办总价 · 付代办</span><b>¥ '+fmt(r.feeTotal,2)+'</b></div>' +
              '<div class="r total"><span>实际总价 · 总款</span><b>¥ '+fmt(r.actual,2)+'</b></div>' +
            '</div>' +
            '<button class="del-btn" onclick="delRec(\''+r.uuid+'\')">删除这笔</button>' +
          '</div>' +
        '</div>';
      });
      html += '</div>';
    });
    box.innerHTML = html;
  }

  // 汇总
  const totNet = data.reduce(function(a,b){ return a+b.net; }, 0);
  const totAmt = data.reduce(function(a,b){ return a+b.amount; }, 0);
  const totFee = data.reduce(function(a,b){ return a+b.feeTotal; }, 0);
  const totAct = data.reduce(function(a,b){ return a+b.actual; }, 0);
  document.getElementById('sumBox').innerHTML =
    '<div class="box"><div class="k">总笔数</div><div class="v">'+data.length+'<small> 笔</small></div></div>'+
    '<div class="box"><div class="k">净总斤数</div><div class="v">'+fmt(totNet,0)+'<small> 斤</small></div></div>'+
    '<div class="box"><div class="k">总价 <em>付货主</em></div><div class="v">¥'+fmt(totAmt,0)+'</div></div>'+
    '<div class="box"><div class="k">代办总价 <em>付代办</em></div><div class="v">¥'+fmt(totFee,0)+'</div></div>'+
    '<div class="box wide"><div class="k">实际总价（总款）</div><div class="v">¥'+fmt(totAct,0)+'</div></div>';

  const cus = {};
  data.forEach(function(r){
    if(!cus[r.customer]) cus[r.customer] = {n:0, net:0, amt:0, fee:0, act:0};
    cus[r.customer].n++;
    cus[r.customer].net += r.net;
    cus[r.customer].amt += r.amount;
    cus[r.customer].fee += r.feeTotal;
    cus[r.customer].act += r.actual;
  });
  let ch = '';
  Object.keys(cus).forEach(function(k){
    ch += '<div class="item"><div class="l"><div class="t">'+k+'</div>'+
          '<div class="m">'+cus[k].n+' 笔　'+fmt(cus[k].net,0)+' 斤</div>'+
          '<div class="m2">总价 ¥'+fmt(cus[k].amt,0)+'　代办 ¥'+fmt(cus[k].fee,0)+'</div></div>'+
          '<div class="am"><b>¥'+fmt(cus[k].act,0)+'</b><small>总款</small></div></div>';
  });
  document.getElementById('cusBox').innerHTML = ch || '<div class="empty">暂无数据</div>';
}

/* ---------- 单笔原地展开（一次只开一条） ---------- */
var openId = null;

function toggleItem(el){
  var item = el.parentNode;
  var id = item.getAttribute('data-id');
  var wasOpen = item.classList.contains('open');
  var opened = document.querySelectorAll('.item.open');
  for(var i = 0; i < opened.length; i++){ opened[i].classList.remove('open'); }
  if(!wasOpen){
    item.classList.add('open');
    openId = id;
  }else{
    openId = null;
  }
}

function delRec(id){
  if(!confirm('删掉这笔记录？删了找不回来。')) return;
  data = data.filter(function(x){ return x.uuid !== id; });
  if(openId === id) openId = null;
  DB.del(id).catch(function(){});
  render();
}

function clearAll(){
  if(!confirm('会清空全部记录，确定吗？')) return;
  if(!confirm('再确认一次：删了就找不回来了')) return;
  data = [];
  DB.clear().catch(function(){});
  render(); updateStoreInfo();
}

function exportCSV(){
  if(!data.length){ alert('没有数据'); return; }
  const head = ['收购日期','客户','批号','车牌号','货主','电话','基地','件数','单件斤数','总斤数','扣土率','扣土量','净总斤数','单价','总价','代办费','代办总价','实际总价'];
  let csv = '\ufeff' + head.join(',') + '\n';
  data.forEach(function(r){
    csv += [r.date,r.customer,r.lot,r.plate,r.owner,r.tel,r.base,r.jian,r.per,
      r.total,(r.soil*100)+'%',r.soilQty,r.net,r.price,r.amount,r.fee,r.feeTotal,r.actual].join(',') + '\n';
  });
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '生姜收购台账_' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
}

function exportJSON(){
  if(!data.length){ alert('没有数据可导出'); return; }
  var payload = {
    app: 'ginger-ledger',
    version: 2,
    exportedAt: new Date().toISOString(),
    deviceId: deviceId,
    operator: operator,
    count: data.length,
    records: data
  };
  var blob = new Blob([JSON.stringify(payload, null, 2)], {type: 'application/json'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '生姜台账备份_' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
}

function importJSON(file){
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(){
    try{
      var obj = JSON.parse(reader.result);
      var list = (obj && obj.records) ? obj.records : obj;
      if(!Array.isArray(list)) throw new Error('文件格式不对');
      var map = {};
      data.forEach(function(r){ map[r.uuid] = r; });
      var added = 0, updated = 0;
      list.forEach(function(r){
        if(!r.uuid) r.uuid = uuid();
        r.deleted = !!r.deleted;
        var old = map[r.uuid];
        if(!old){ map[r.uuid] = r; added++; }
        else if((r.updatedAt || 0) > (old.updatedAt || 0)){ map[r.uuid] = r; updated++; }
      });
      var merged = Object.keys(map).map(function(k){ return map[k]; })
        .filter(function(r){ return !r.deleted; })
        .sort(function(a, b){ return (b.createdAt || 0) - (a.createdAt || 0); });
      data = merged;
      DB.putMany(merged).then(function(){
        render(); updateStoreInfo();
        alert('导入完成：新增 ' + added + ' 条，更新 ' + updated + ' 条，现有 ' + merged.length + ' 条');
      }).catch(function(){
        alert('写入失败，请重试');
      });
    }catch(e){
      alert('导入失败：' + e.message);
    }
  };
  reader.readAsText(file);
}

function showTab(name){
  document.querySelectorAll('nav button').forEach(function(b){
    b.classList.toggle('on', b.dataset.tab === name);
  });
  ['in','list','sum'].forEach(function(k){
    document.getElementById('tab-'+k).classList.toggle('hide', k !== name);
  });
  window.scrollTo(0,0);
}

document.querySelectorAll('nav button').forEach(function(b){
  b.onclick = function(){ showTab(b.dataset.tab); };
});

/* ---------- 强制安装引导 ---------- */
var ua = navigator.userAgent;
var isWeChat = /MicroMessenger/i.test(ua);
var isIOS = /iPhone|iPad|iPod/i.test(ua);
var deferredPrompt = null;
var standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
var installedFlag = localStorage.getItem('gl_installed') === '1';

var elGuide = document.getElementById('guide');
var elGa = document.getElementById('ga');
var elGt = document.getElementById('gt');
var elGsub = document.getElementById('gsub');
var elGs = document.getElementById('gs');
var elGmain = document.getElementById('gmain');
var elGdone = document.getElementById('gdone');

function hideGuide(){
  elGuide.classList.add('hide');
  elGa.style.display = 'none';
}
function markInstalled(){
  localStorage.setItem('gl_installed', '1');
  hideGuide();
}
function showGuide(cfg){
  elGt.textContent = cfg.title || '';
  elGsub.textContent = cfg.sub || '';
  elGs.innerHTML = (cfg.steps || []).map(function(s){ return '<li>' + s + '</li>'; }).join('');
  var hasMain = !!cfg.onMain;
  if(hasMain){
    elGmain.textContent = cfg.btn || '立即安装';
    elGmain.classList.remove('hide');
    elGmain.onclick = cfg.onMain;
  }else{
    elGmain.classList.add('hide');
    elGmain.onclick = null;
  }
  elGdone.classList.toggle('hide', hasMain || cfg.done === false);
  elGa.textContent = cfg.arrow === 'tr' ? '↗' : (cfg.arrow === 'br' ? '↘' : '↑');
  elGa.className = 'ga' + (cfg.arrow ? ' ' + cfg.arrow : '');
  elGa.style.display = cfg.arrow ? 'block' : 'none';
  elGuide.classList.remove('hide');
}

elGdone.onclick = markInstalled;

function guideWeChat(){
  showGuide({
    title: '微信里装不了，先换到浏览器',
    sub: '按下面两步操作，换到浏览器后会自动出现安装步骤',
    steps: ['点右上角的「···」', '选「在浏览器打开」'],
    arrow: 'tr',
    done: false
  });
}
function guideIOS(){
  showGuide({
    title: '把台账装到手机桌面',
    sub: '装好后点桌面图标直接进，不用再找链接',
    steps: ['点底部中间的「分享」按钮', '往下滑，选「添加到主屏幕」', '点右上角「添加」'],
    arrow: 'bc',
    btn: '我已经装好了，进入台账',
    onMain: markInstalled
  });
}
function guideAndroid(){
  showGuide({
    title: '把台账装到手机桌面',
    sub: '装完后点桌面图标直接进，不用再找链接',
    steps: [
      '点浏览器底部最右边的菜单按钮（≡ 或 ⋮）',
      '在菜单里找「添加到桌面」或「添加到主屏幕」',
      '确认添加，桌面上会出现绿色「姜」字图标'
    ],
    arrow: 'br',
    btn: '已添加到桌面，进入台账',
    onMain: markInstalled
  });
}

window.addEventListener('beforeinstallprompt', function(e){
  e.preventDefault();
  deferredPrompt = e;
  // 微信/QQ 内置浏览器会伪触发这个事件，但点了装不上，一律不认
  if(isWeChat || /QQ\//i.test(ua)) return;
  if(standalone || installedFlag || location.hash.indexOf('#demo') === 0) return;
  showGuide({
    title: '一步装到桌面',
    sub: '点下面的按钮，系统会弹确认框，选「安装」即可',
    steps: [],
    arrow: '',
    btn: '立即安装',
    onMain: function(){
      var dp = deferredPrompt;
      if(!dp) return;
      deferredPrompt = null;
      var ok = false;
      try{ dp.prompt(); ok = true; }catch(err){ ok = false; }
      if(dp.userChoice && dp.userChoice.then){
        dp.userChoice.then(function(choice){
          if(choice && choice.outcome === 'dismissed'){ setTimeout(guideAndroid, 200); }
        }).catch(function(){ setTimeout(guideAndroid, 200); });
      }else if(!ok){
        // 华为等浏览器调不出系统安装框，直接退回手动添加
        setTimeout(guideAndroid, 200);
      }
    }
  });
});

window.addEventListener('appinstalled', function(){
  localStorage.setItem('gl_installed', '1');
  hideGuide();
});

if(standalone || installedFlag || location.hash.indexOf('#demo') === 0){
  hideGuide();
}else if(isWeChat){
  guideWeChat();
}else if(isIOS){
  guideIOS();
}else{
  guideAndroid();
}

if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
</script>
