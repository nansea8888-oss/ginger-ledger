<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="生姜台账">
<meta name="theme-color" content="#2F5D50">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>生姜收购台账</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{width:100%;overflow-x:hidden}
body{width:100%;max-width:100vw;overflow-x:hidden;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;background:#F4F6F5;color:#1F2A24;font-size:16px;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
header,nav,main,section,.card,.row,.calc,.sum,.grp,#listBox,#cusBox{max-width:100%}
input,select,button{max-width:100%}
header{background:#2F5D50;color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 14px;font-size:18px;font-weight:600;position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;overflow:hidden}
header>span:first-child{white-space:nowrap}
header .sub{font-size:11.5px;font-weight:400;opacity:.8;flex-shrink:0;margin-left:8px}
nav{display:flex;background:#fff;border-bottom:1px solid #E3E8E5;position:sticky;top:calc(50px + env(safe-area-inset-top));z-index:9}
nav button{flex:1 1 0;min-width:0;padding:12px 0;border:0;background:none;font-size:15px;color:#6B7C74;font-family:inherit;border-bottom:3px solid transparent}
nav button.on{color:#2F5D50;font-weight:600;border-bottom-color:#2F5D50}
main{padding:12px;max-width:100%;overflow-x:hidden}
.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.card h3{font-size:14px;color:#5A6B63;font-weight:600;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.row{display:flex;gap:10px;margin-bottom:10px}
.row>*{flex:1 1 0;min-width:0}
label{display:block;font-size:12px;color:#7A8A82;margin-bottom:4px}
input,select{width:100%;min-width:0;max-width:100%;padding:11px 10px;border:1px solid #D8E0DB;border-radius:8px;font-size:16px;font-family:inherit;background:#fff;color:#1F2A24}
input:focus,select:focus{outline:none;border-color:#2F5D50;background:#F8FBF9}
.calc{background:#F7FAF8;border:1px dashed #C9D8D0;border-radius:10px;padding:10px;margin-bottom:12px}
.calc .line{display:flex;justify-content:space-between;padding:5px 0;font-size:14px;color:#5A6B63}
.calc .line b{color:#1F2A24;font-weight:600}
.calc .line .hint{font-style:normal;font-size:11.5px;color:#9AA8A1;margin-left:5px}
.calc .big{border-top:1px solid #DCE6E0;margin-top:6px;padding-top:8px;font-size:16px}
.calc .big b{color:#C0392B;font-size:20px}
.btn{width:100%;padding:15px;border:0;border-radius:10px;background:#2F5D50;color:#fff;font-size:17px;font-weight:600;font-family:inherit;margin-top:4px}
.btn:active{background:#24483E}
.btn.ghost{background:#EAF1ED;color:#2F5D50;font-size:15px;padding:12px;margin-top:8px}
.grp{background:#fff;border-radius:12px;margin-bottom:10px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.grp .gh{padding:13px 14px;background:#EAF1ED;display:flex;justify-content:space-between;align-items:center;font-weight:600;color:#2F5D50;font-size:15px;gap:8px}
.grp .gh .g1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grp .gh .g2{font-size:12px;font-weight:400;color:#5A6B63;text-align:right;white-space:nowrap;flex-shrink:0}
.item{padding:13px 14px;border-top:1px solid #F0F4F2;cursor:pointer}
.item:active{background:#F5F9F7}
.it-hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px;gap:8px}
.it-name{font-size:16.5px;font-weight:600;color:#1F2A24;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it-jin{font-size:15px;font-weight:600;color:#2F5D50;white-space:nowrap}
.it-sub{font-size:12.5px;color:#7A8A82;margin-bottom:7px}
.it-mid{font-size:13px;color:#4A5B53;line-height:1.7;margin-bottom:9px}
.it-mid em{font-style:normal;color:#9AA8A1;margin:0 4px}
.it-ft{display:flex;align-items:baseline;gap:16px;padding-top:9px;border-top:1px dashed #E5EBE8;font-size:12.5px;color:#7A8A82}
.it-ft b{color:#1F2A24;font-weight:600;font-size:14px}
.it-ft .grand{margin-left:auto;color:#C0392B;font-weight:700;font-size:16px}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.sum .box{background:#fff;border-radius:12px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.sum .box .k{font-size:12px;color:#7A8A82;margin-bottom:6px}
.sum .box .v{font-size:19px;font-weight:700;color:#2F5D50}
.sum .box .v small{font-size:12px;font-weight:400;color:#7A8A82}
.sum .box em{font-style:normal;font-size:10.5px;color:#9AA8A1}
.sum .box.wide{grid-column:1/-1;background:#2F5D50}
.sum .box.wide .k{color:#AECBBF}
.sum .box.wide .v{color:#fff;font-size:26px}
.item .m2{font-size:12px;color:#5A6B63;margin-top:3px}
.empty{text-align:center;color:#9AA8A1;padding:50px 20px;font-size:14px;line-height:1.8}
.tip{font-size:12px;color:#9AA8A1;text-align:center;padding:14px 10px;line-height:1.7}
.ibar{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));background:#1F2A24;color:#fff;border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:10px;font-size:13px;line-height:1.5;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.28)}
.ibar .txt{flex:1}
.ibar button{border:0;border-radius:9px;padding:9px 14px;font-size:13px;font-family:inherit;white-space:nowrap}
.ibar .go{background:#2F5D50;color:#fff;font-weight:600}
.ibar .x{background:none;color:#7E8C85;font-size:20px;padding:2px 6px}
.guide{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(12,22,17,.88);z-index:9999;display:flex;align-items:center;justify-content:center;padding:24px}
.guide-box{background:#fff;border-radius:18px;padding:26px 22px;max-width:340px;width:100%;text-align:center}
.guide-box h2{font-size:19px;color:#1F2A24;margin-bottom:16px;line-height:1.4}
.guide-steps{text-align:left;margin:0 auto 20px;display:inline-block}
.guide-steps div{font-size:14.5px;color:#1F2A24;padding:8px 0;display:flex;gap:10px;align-items:flex-start;line-height:1.5}
.guide-steps i{display:inline-flex;width:22px;height:22px;border-radius:50%;background:#2F5D50;color:#fff;font-size:12px;font-style:normal;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.guide-box button{width:100%;padding:14px;border:0;border-radius:11px;background:#2F5D50;color:#fff;font-size:16px;font-weight:600;font-family:inherit}
.guide-arrow{position:fixed;top:10px;right:16px;font-size:44px;color:#fff;line-height:1;animation:blink 1.1s infinite;text-shadow:0 2px 8px rgba(0,0,0,.5)}
@keyframes blink{0%,100%{opacity:.3;transform:translateY(0)}50%{opacity:1;transform:translateY(-5px)}}
.sheet{position:fixed;top:0;left:0;right:0;bottom:0;z-index:9998;display:flex;align-items:flex-end}
.sheet .mask{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.45)}
.sheet .box{position:relative;width:100%;max-height:86vh;background:#fff;border-radius:18px 18px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet .hd{padding:16px 18px 10px;display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1px solid #EEF3F0;gap:10px}
.sheet .hd h3{font-size:17px;color:#1F2A24;line-height:1.4;flex:1}
.sheet .hd small{display:block;font-size:12px;color:#7A8A82;font-weight:400;margin-top:3px}
.sheet .hd button{border:0;background:#F1F5F3;color:#6B7C74;width:30px;height:30px;border-radius:50%;font-size:16px;line-height:1;flex-shrink:0}
.sheet .bd{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 18px 4px}
.sheet .ft{padding:12px 18px 16px;border-top:1px solid #EEF3F0}
.sheet .ft button{width:100%;padding:14px;border:0;border-radius:11px;background:#FDEDEC;color:#C0392B;font-size:15px;font-weight:600;font-family:inherit}
.dlg-g{font-size:11.5px;color:#9AA8A1;padding:14px 0 4px;font-weight:600;letter-spacing:.5px}
.dlg-r{display:flex;justify-content:space-between;gap:12px;padding:9px 0;font-size:14.5px;border-bottom:1px solid #F4F7F5}
.dlg-r:last-child{border-bottom:0}
.dlg-r span{color:#7A8A82;flex-shrink:0}
.dlg-r b{font-weight:600;color:#1F2A24;text-align:right;word-break:break-all}
.dlg-r.hl{padding:14px 0 18px;border-top:2px solid #2F5D50;border-bottom:0;margin-top:8px}
.dlg-r.hl span{color:#1F2A24;font-weight:600;font-size:15px}
.dlg-r.hl b{color:#C0392B;font-size:23px}
.hide{display:none}
</style>
</head>
<body>

<header>
  <span>生姜收购台账</span>
  <span class="sub" id="today"></span>
</header>

<nav>
  <button class="on" data-tab="in">录入</button>
  <button data-tab="list">明细</button>
  <button data-tab="sum">汇总</button>
</nav>

<main>
  <!-- 录入 -->
  <section id="tab-in">
    <div class="card">
      <h3>客户与批次</h3>
      <div class="row">
        <div>
          <label>客户（买家）</label>
          <input id="customer" list="dl-cus" placeholder="选或直接打">
          <datalist id="dl-cus"></datalist>
        </div>
        <div>
          <label>批号</label>
          <input id="lot" placeholder="20250217-01">
        </div>
      </div>
      <div class="row">
        <div>
          <label>车牌号</label>
          <input id="plate" placeholder="鲁A12345">
        </div>
        <div>
          <label>收购日期</label>
          <input id="date" type="date">
        </div>
      </div>
    </div>

    <div class="card">
      <h3>货主（卖家）</h3>
      <div class="row">
        <div>
          <label>货主</label>
          <input id="owner" list="dl-own" placeholder="选或直接打">
          <datalist id="dl-own"></datalist>
        </div>
        <div>
          <label>电话</label>
          <input id="tel" type="tel" inputmode="tel" placeholder="手机号">
        </div>
      </div>
      <div>
        <label>基地</label>
        <input id="base" placeholder="王家村基地">
      </div>
    </div>

    <div class="card">
      <h3>计量与价格</h3>
      <div class="row">
        <div>
          <label>件数</label>
          <input id="jian" type="number" inputmode="decimal" placeholder="0">
        </div>
        <div>
          <label>单件斤数</label>
          <input id="per" type="number" inputmode="decimal" placeholder="0">
        </div>
      </div>
      <div class="row">
        <div>
          <label>扣土率（%）</label>
          <input id="soil" type="number" inputmode="decimal" placeholder="10">
        </div>
        <div>
          <label>单价（元/斤）</label>
          <input id="price" type="number" inputmode="decimal" placeholder="0.00">
        </div>
      </div>
      <div>
        <label>代办费（元/斤）</label>
        <input id="fee" type="number" inputmode="decimal" placeholder="0.05">
      </div>

      <div class="calc" style="margin-top:12px;margin-bottom:0">
        <div class="line"><span>总斤数</span><b id="c1">0</b></div>
        <div class="line"><span>扣土量</span><b id="c2">0</b></div>
        <div class="line"><span>净总斤数</span><b id="c3">0</b></div>
        <div class="line"><span>总价 <i class="hint">付货主</i></span><b id="c4">0</b></div>
        <div class="line"><span>代办总价 <i class="hint">付代办</i></span><b id="c5">0</b></div>
        <div class="line big"><span>实际总价 <i class="hint">总款</i></span><b id="c6">0</b></div>
      </div>

      <button class="btn" onclick="saveRec()">保 存</button>
    </div>

    <p class="tip">数据存在这台手机的浏览器里。换手机或清缓存会丢，建议定期用「导出」。 </p>
  </section>

  <!-- 明细 -->
  <section id="tab-list" class="hide">
    <div id="listBox"></div>
  </section>

  <!-- 汇总 -->
  <section id="tab-sum" class="hide">
    <div class="sum" id="sumBox"></div>
    <div class="card">
      <h3>按客户汇总</h3>
      <div id="cusBox"></div>
    </div>
    <button class="btn ghost" onclick="exportCSV()">导出 Excel（CSV）</button>
    <button class="btn ghost" onclick="clearAll()" style="color:#C0392B">清空全部数据</button>
  </section>
</main>

<div id="ibar" class="ibar hide">
  <span class="txt" id="ibarTxt"></span>
  <button class="go" id="ibarGo">安装</button>
  <button class="x" id="ibarX">×</button>
</div>

<div id="guide" class="guide hide">
  <span class="guide-arrow" id="guideArrow">↗</span>
  <div class="guide-box">
    <h2 id="guideTitle"></h2>
    <div class="guide-steps" id="guideSteps"></div>
    <button id="guideClose">我知道了</button>
  </div>
</div>

<div id="sheet" class="sheet hide">
  <div class="mask" onclick="closeSheet()"></div>
  <div class="box">
    <div class="hd">
      <h3 id="shTitle"></h3>
      <button onclick="closeSheet()">✕</button>
    </div>
    <div class="bd" id="shBody"></div>
    <div class="ft"><button id="shDel">删除这笔</button></div>
  </div>
</div>

<script>
const KEY = 'ginger_ledger_v1';
let data = [];

function n(id){ const v = parseFloat(document.getElementById(id).value); return isNaN(v) ? 0 : v; }
function s(id){ return (document.getElementById(id).value || '').trim(); }
function fmt(x, d){ return (Math.round(x*100)/100).toFixed(d===undefined?2:d).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }

function load(){
  try{ data = JSON.parse(localStorage.getItem(KEY) || '[]'); }catch(e){ data = []; }
  // 兼容修正：老版本把"实际总价"算成了减法，统一改成 总价 + 代办总价
  data.forEach(function(r){
    if(typeof r.amount === 'number' && typeof r.feeTotal === 'number'){
      r.actual = r.amount + r.feeTotal;
    }
  });
}
function persist(){ localStorage.setItem(KEY, JSON.stringify(data)); }

function recalc(){
  const jian=n('jian'), per=n('per'), soil=n('soil')/100, price=n('price'), fee=n('fee');
  const total = jian*per;
  const soilQty = total*soil;
  const net = total-soilQty;
  const amount = net*price;          // 总价：付给货主的钱
  const feeTotal = net*fee;          // 代办总价：付给代办的钱
  const actual = amount + feeTotal;  // 实际总价：老板要掏的总款
  document.getElementById('c1').textContent = fmt(total);
  document.getElementById('c2').textContent = fmt(soilQty);
  document.getElementById('c3').textContent = fmt(net);
  document.getElementById('c4').textContent = fmt(amount);
  document.getElementById('c5').textContent = fmt(feeTotal);
  document.getElementById('c6').textContent = '¥ ' + fmt(actual);
}

['jian','per','soil','price','fee'].forEach(function(id){
  document.getElementById(id).addEventListener('input', recalc);
});

function saveRec(){
  const customer = s('customer');
  const owner = s('owner');
  const jian = n('jian'), per = n('per');
  if(!customer){ alert('请填写客户（买家）'); return; }
  if(!owner){ alert('请填写货主（卖家）'); return; }
  if(jian<=0 || per<=0){ alert('件数和单件斤数要大于 0'); return; }

  const soil = n('soil')/100, price = n('price'), fee = n('fee');
  const total = jian*per;
  const soilQty = total*soil;
  const net = total-soilQty;

  data.unshift({
    id: Date.now(),
    date: s('date') || new Date().toISOString().slice(0,10),
    customer: customer, lot: s('lot'), plate: s('plate'),
    owner: owner, tel: s('tel'), base: s('base'),
    jian: jian, per: per, soil: soil,
    price: price, fee: fee,
    total: total, soilQty: soilQty, net: net,
    amount: net*price, feeTotal: net*fee, actual: net*price + net*fee
  });
  persist();

  ['lot','plate','owner','tel','base','jian','per','price'].forEach(function(id){
    document.getElementById(id).value = '';
  });
  recalc();
  render();
  alert('已保存 ✓');
  showTab('list');
}

function render(){
  // 客户 / 货主联想
  const cusSet = {}, ownSet = {};
  data.forEach(function(r){ cusSet[r.customer]=1; ownSet[r.owner]=1; });
  document.getElementById('dl-cus').innerHTML =
    Object.keys(cusSet).map(function(k){ return '<option value="'+k+'">'; }).join('');
  document.getElementById('dl-own').innerHTML =
    Object.keys(ownSet).map(function(k){ return '<option value="'+k+'">'; }).join('');

  // 明细（按客户分组）
  const box = document.getElementById('listBox');
  if(!data.length){
    box.innerHTML = '<div class="empty">还没有记录<br>去「录入」填第一笔吧</div>';
  }else{
    const groups = {};
    data.forEach(function(r){ (groups[r.customer] = groups[r.customer] || []).push(r); });
    let html = '';
    Object.keys(groups).forEach(function(cus){
      const arr = groups[cus];
      const net = arr.reduce(function(a,b){ return a+b.net; }, 0);
      const act = arr.reduce(function(a,b){ return a+b.actual; }, 0);
      html += '<div class="grp"><div class="gh"><span class="g1">'+cus+'</span>'+
              '<span class="g2">'+arr.length+' 笔 · '+fmt(net,0)+' 斤 · 总款 ¥'+fmt(act,0)+'</span></div>';
      arr.forEach(function(r){
        var total = (typeof r.total === 'number') ? r.total : (r.jian * r.per);
        var soilPct = ((r.soil || 0) * 100).toFixed(0);
        html += '<div class="item" onclick="openSheet(' + r.id + ')">' +
          '<div class="it-hd"><span class="it-name">'+r.owner+'</span>' +
          '<span class="it-jin">'+fmt(total,0)+' 斤</span></div>' +
          '<div class="it-sub">'+(r.base||'—')+' · '+(r.plate||'—')+' · '+(r.lot||'—')+'</div>' +
          '<div class="it-mid">'+(r.jian||0)+' 件 × '+fmt(r.per,0)+' 斤<em>=</em>'+fmt(total,0)+' 斤' +
            '<em>扣土</em>'+soilPct+'%<em>净</em>'+fmt(r.net,0)+' 斤' +
            '<br>单价 '+fmt(r.price,4)+' 元/斤' +
          '</div>' +
          '<div class="it-ft"><span>总价 <b>'+fmt(r.amount,0)+'</b></span>' +
            '<span>代办 <b>'+fmt(r.feeTotal,0)+'</b></span>' +
            '<span class="grand">总款 ¥'+fmt(r.actual,0)+'</span></div>' +
        '</div>';
      });
      html += '</div>';
    });
    box.innerHTML = html;
  }

  // 汇总
  const totNet = data.reduce(function(a,b){ return a+b.net; }, 0);
  const totAmt = data.reduce(function(a,b){ return a+b.amount; }, 0);
  const totFee = data.reduce(function(a,b){ return a+b.feeTotal; }, 0);
  const totAct = data.reduce(function(a,b){ return a+b.actual; }, 0);
  document.getElementById('sumBox').innerHTML =
    '<div class="box"><div class="k">总笔数</div><div class="v">'+data.length+'<small> 笔</small></div></div>'+
    '<div class="box"><div class="k">净总斤数</div><div class="v">'+fmt(totNet,0)+'<small> 斤</small></div></div>'+
    '<div class="box"><div class="k">总价 <em>付货主</em></div><div class="v">¥'+fmt(totAmt,0)+'</div></div>'+
    '<div class="box"><div class="k">代办总价 <em>付代办</em></div><div class="v">¥'+fmt(totFee,0)+'</div></div>'+
    '<div class="box wide"><div class="k">实际总价（总款）</div><div class="v">¥'+fmt(totAct,0)+'</div></div>';

  const cus = {};
  data.forEach(function(r){
    if(!cus[r.customer]) cus[r.customer] = {n:0, net:0, amt:0, fee:0, act:0};
    cus[r.customer].n++;
    cus[r.customer].net += r.net;
    cus[r.customer].amt += r.amount;
    cus[r.customer].fee += r.feeTotal;
    cus[r.customer].act += r.actual;
  });
  let ch = '';
  Object.keys(cus).forEach(function(k){
    ch += '<div class="item"><div class="l"><div class="t">'+k+'</div>'+
          '<div class="m">'+cus[k].n+' 笔　'+fmt(cus[k].net,0)+' 斤</div>'+
          '<div class="m2">总价 ¥'+fmt(cus[k].amt,0)+'　代办 ¥'+fmt(cus[k].fee,0)+'</div></div>'+
          '<div class="am"><b>¥'+fmt(cus[k].act,0)+'</b><small>总款</small></div></div>';
  });
  document.getElementById('cusBox').innerHTML = ch || '<div class="empty">暂无数据</div>';
}

/* ---------- 单笔详情 ---------- */
var curId = null;

function findRec(id){
  for(var i = 0; i < data.length; i++){ if(data[i].id === id) return data[i]; }
  return null;
}

function openSheet(id){
  var r = findRec(id);
  if(!r) return;
  curId = id;
  document.getElementById('shTitle').innerHTML =
    (r.owner || '—') + '<small>' + (r.base || '—') + ' · ' + (r.date || '—') + '</small>';
  document.getElementById('shBody').innerHTML = buildDetail(r);
  document.getElementById('sheet').classList.remove('hide');
  document.getElementById('shBody').scrollTop = 0;
}

function closeSheet(){
  document.getElementById('sheet').classList.add('hide');
  curId = null;
}

function buildDetail(r){
  function row(k, v){ return '<div class="dlg-r"><span>' + k + '</span><b>' + v + '</b></div>'; }
  var total = (typeof r.total === 'number') ? r.total : (r.jian * r.per);
  var soilQty = (typeof r.soilQty === 'number') ? r.soilQty : (total * (r.soil || 0));
  var h = '';
  h += '<div class="dlg-g">交易信息</div>';
  h += row('客户（买家）', r.customer || '—');
  h += row('批号', r.lot || '—');
  h += row('车牌号', r.plate || '—');
  h += row('收购日期', r.date || '—');
  h += '<div class="dlg-g">货主信息</div>';
  h += row('货主（卖家）', r.owner || '—');
  h += row('电话', r.tel || '—');
  h += row('基地', r.base || '—');
  h += '<div class="dlg-g">计量</div>';
  h += row('件数', (r.jian || 0) + ' 件');
  h += row('单件斤数', fmt(r.per, 2) + ' 斤');
  h += row('总斤数', fmt(total, 2) + ' 斤');
  h += row('扣土率', ((r.soil || 0) * 100).toFixed(1) + ' %');
  h += row('扣土量', fmt(soilQty, 2) + ' 斤');
  h += row('净总斤数', fmt(r.net, 2) + ' 斤');
  h += '<div class="dlg-g">金额</div>';
  h += row('单价', fmt(r.price, 4) + ' 元/斤');
  h += row('总价（付货主）', '¥ ' + fmt(r.amount, 2));
  h += row('代办费', fmt(r.fee, 4) + ' 元/斤');
  h += row('代办总价（付代办）', '¥ ' + fmt(r.feeTotal, 2));
  h += '<div class="dlg-r hl"><span>实际总价（总款）</span><b>¥ ' + fmt(r.actual, 2) + '</b></div>';
  return h;
}

document.getElementById('shDel').onclick = function(){
  if(!curId) return;
  if(!confirm('删掉这笔记录？删了找不回来。')) return;
  var id = curId;
  data = data.filter(function(x){ return x.id !== id; });
  persist();
  closeSheet();
  render();
};

function clearAll(){
  if(!confirm('会清空全部记录，确定吗？')) return;
  if(!confirm('再确认一次：删了就找不回来了')) return;
  data = []; persist(); render();
}

function exportCSV(){
  if(!data.length){ alert('没有数据'); return; }
  const head = ['收购日期','客户','批号','车牌号','货主','电话','基地','件数','单件斤数','总斤数','扣土率','扣土量','净总斤数','单价','总价','代办费','代办总价','实际总价'];
  let csv = '\ufeff' + head.join(',') + '\n';
  data.forEach(function(r){
    csv += [r.date,r.customer,r.lot,r.plate,r.owner,r.tel,r.base,r.jian,r.per,
      r.total,(r.soil*100)+'%',r.soilQty,r.net,r.price,r.amount,r.fee,r.feeTotal,r.actual].join(',') + '\n';
  });
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '生姜收购台账_' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
}

function showTab(name){
  document.querySelectorAll('nav button').forEach(function(b){
    b.classList.toggle('on', b.dataset.tab === name);
  });
  ['in','list','sum'].forEach(function(k){
    document.getElementById('tab-'+k).classList.toggle('hide', k !== name);
  });
  window.scrollTo(0,0);
}

document.querySelectorAll('nav button').forEach(function(b){
  b.onclick = function(){ showTab(b.dataset.tab); };
});

/* ---------- PWA：安装引导 ---------- */
var ua = navigator.userAgent;
var isWeChat = /MicroMessenger/i.test(ua);
var isIOS = /iPhone|iPad|iPod/i.test(ua);
var deferredPrompt = null;
var standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;

function hideGuide(){ document.getElementById('guide').classList.add('hide'); }
function showGuide(title, steps, arrow){
  if(standalone) return;
  document.getElementById('guideTitle').textContent = title;
  document.getElementById('guideSteps').innerHTML = steps.map(function(s, i){
    return '<div><i>' + (i + 1) + '</i><span>' + s + '</span></div>';
  }).join('');
  document.getElementById('guideArrow').style.display = arrow ? 'block' : 'none';
  document.getElementById('guide').classList.remove('hide');
}
function showIbar(txt){
  if(standalone) return;
  document.getElementById('ibarTxt').textContent = txt;
  document.getElementById('ibar').classList.remove('hide');
}

document.getElementById('guideClose').onclick = hideGuide;

window.addEventListener('beforeinstallprompt', function(e){
  e.preventDefault();
  deferredPrompt = e;
  hideGuide();
  showIbar('点「安装」，把台账装到桌面');
});

document.getElementById('ibarGo').onclick = function(){
  if(deferredPrompt){
    deferredPrompt.prompt();
    deferredPrompt = null;
    document.getElementById('ibar').classList.add('hide');
  }else if(isIOS){
    showGuide('这样装到桌面', [
      '点底部的「分享」按钮 ⬆️',
      '往下滑，找到「添加到主屏幕」',
      '点右上角「添加」'
    ], false);
  }else{
    showGuide('这样加到桌面', [
      '点浏览器底部的菜单（≡ 或 ···）',
      '选「添加到桌面」或「添加到主屏幕」',
      '确认添加，桌面上就有绿色「姜」字图标'
    ], false);
  }
};

document.getElementById('ibarX').onclick = function(){
  localStorage.setItem('ibar_closed', '1');
  document.getElementById('ibar').classList.add('hide');
};

if(!standalone){
  if(isWeChat){
    // 微信内置浏览器装不了，必须先赶去系统浏览器
    showGuide('微信里装不了，先换个地方打开', [
      '点右上角「···」',
      '选「在浏览器打开」',
      '打开后按页面提示装到桌面'
    ], true);
  }else if(localStorage.getItem('ibar_closed') !== '1'){
    setTimeout(function(){
      if(!deferredPrompt){
        showIbar(isIOS ? '点这里装到桌面（添加到主屏幕）' : '点这里装到桌面');
      }
    }, 1500);
  }
}

if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
