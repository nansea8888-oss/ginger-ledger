<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>生姜台账 · 扫码进入</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#EEF2F0;padding:20px;color:#22312C}
.wrap{max-width:760px;margin:0 auto}
h1{font-size:20px;color:#2F5D50;margin-bottom:6px}
.sub{font-size:13px;color:#8A9992;margin-bottom:22px;line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.qc{background:#fff;border-radius:14px;padding:16px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.qc img{width:100%;max-width:180px;height:auto;display:block;margin:0 auto 10px;border-radius:8px}
.qc .nm{font-size:14.5px;font-weight:700;color:#2F5D50;margin-bottom:3px}
.qc .cd{font-size:12px;color:#8A9992}
.qc .cd b{color:#C0392B;font-size:15px;letter-spacing:1px}
.tip{background:#FFF8E6;border:1px solid #FFE4A3;border-radius:10px;padding:13px 15px;margin-bottom:20px;font-size:12.5px;color:#8A6D1F;line-height:1.8}
.tip b{color:#6B5416}
.acts{text-align:center;margin-top:22px}
.acts button{padding:12px 26px;border:0;border-radius:10px;background:#2F5D50;color:#fff;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;margin:0 6px}
.acts button.ghost{background:#fff;color:#2F5D50;border:1px solid #DCE7E2}
@media print{
  body{background:#fff;padding:0}
  .tip,.acts,h1,.sub{display:none}
  .grid{grid-template-columns:repeat(3,1fr);gap:20px}
  .qc{box-shadow:none;border:1px solid #ddd;page-break-inside:avoid}
}
</style>
</head>
<body>
<div class="wrap">
  <h1>生姜台账 · 扫码进入</h1>
  <div class="sub">手机扫码直接打开台账，不用输链接、不用打字</div>

  <div class="tip">
    <b>怎么用：</b><br>
    ① 老板扫自己的码 → 直接进台账<br>
    ② 员工扫自己的码 → 进去后点「协作」→「我有邀请码」→ 输账本邀请码 → 申请加入<br>
    ③ 老板在协作页同意 → 员工就能看到账本了<br><br>
    <b>建议：</b>打印出来贴在店里，或截图发微信群，让每人只扫自己那张
  </div>

  <div class="grid" id="grid"></div>

  <div class="acts">
    <button onclick="window.print()">打印这一页</button>
    <button class="ghost" onclick="location.href='/'">回台账</button>
    <button class="ghost" onclick="window.open('开发文档.md')">开发文档</button>
    <button class="ghost" onclick="window.open('数据库结构与安全策略.md')">数据库结构</button>
  </div>
</div>

<script>
const accounts = [
  { name: '老板',     code: '8888', file: 'qr/8888_老板.png' },
  { name: '收购员',   code: '1111', file: 'qr/1111_收购员.png' },
  { name: '员工1',    code: '2001', file: 'qr/2001_员工1.png' },
  { name: '员工2',    code: '2002', file: 'qr/2002_员工2.png' },
  { name: '员工3',    code: '2003', file: 'qr/2003_员工3.png' },
  { name: '员工4',    code: '2004', file: 'qr/2004_员工4.png' },
  { name: '员工5',    code: '2005', file: 'qr/2005_员工5.png' }
];
document.getElementById('grid').innerHTML = accounts.map(a =>
  `<div class="qc">
    <img src="${a.file}" alt="${a.name}">
    <div class="nm">${a.name}</div>
    <div class="cd">登录码 <b>${a.code}</b></div>
  </div>`
).join('');
</script>
</body>
</html>
