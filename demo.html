<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>生姜台账 · Demo</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;background:#F4F6F5;color:#1F2A24;font-size:16px}
.hide{display:none!important}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px}

/* 登录 */
#login{position:fixed;inset:0;background:linear-gradient(160deg,#2F5D50,#1E4A3C);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;z-index:100}
#login h1{color:#fff;font-size:24px;margin-bottom:8px}
#login p{color:#A8C4BA;font-size:13px;margin-bottom:28px;text-align:center;line-height:1.6}
#login input{width:100%;max-width:300px;padding:15px;border:0;border-radius:12px;font-size:17px;text-align:center;letter-spacing:2px;margin-bottom:14px}
#login button{width:100%;max-width:300px;padding:16px;border:0;border-radius:12px;background:#FFC94D;color:#2F5D50;font-size:17px;font-weight:700}
#login .tip2{color:#7FA99B;font-size:11.5px;margin-top:20px;text-align:center;line-height:1.8}

/* 主界面 */
#app{padding-bottom:80px}
header{background:#2F5D50;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:50}
header .t{font-size:16px;font-weight:600;white-space:nowrap;flex-shrink:0}
header select{background:rgba(255,255,255,.16);color:#fff;border:0;border-radius:8px;padding:7px 8px;font-size:12.5px;max-width:150px}
header select option{color:#1F2A24}

nav{display:flex;background:#fff;border-bottom:1px solid #E3E8E5;position:sticky;top:56px;z-index:49}
nav button{flex:1;padding:12px 0;border:0;background:none;font-size:13px;color:#6B7C74;border-bottom:3px solid transparent}
nav button.on{color:#2F5D50;font-weight:700;border-bottom-color:#2F5D50}

main{padding:12px}
.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.card h3{font-size:13.5px;color:#5A6B63;font-weight:600;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
label{display:block;font-size:12px;color:#7A8A82;margin-bottom:5px}
input,select{width:100%;padding:11px 10px;border:1px solid #D8E0DB;border-radius:8px;font-size:15px;background:#fff;color:#1F2A24}
input:focus,select:focus{outline:none;border-color:#2F5D50;background:#F8FBF9}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.row>*{min-width:0}
.mb{margin-bottom:10px}
.btn{width:100%;padding:15px;border:0;border-radius:10px;background:#2F5D50;color:#fff;font-size:16px;font-weight:600}
.btn.ghost{background:#EAF1ED;color:#2F5D50}
.btn.sm{padding:9px;font-size:13px;border-radius:8px}

.hint{font-size:11.5px;color:#9AA8A1;margin-top:5px}
.hint.warn{color:#C0392B}
.pill{display:inline-block;font-size:11px;padding:3px 8px;border-radius:20px;background:#EAF1ED;color:#2F5D50;margin-left:6px}

/* 合同 */
.shots{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.shot{width:64px;height:64px;border-radius:8px;overflow:hidden;position:relative;background:#F1F5F3}
.shot img{width:100%;height:100%;object-fit:cover;display:block}
.shot .x{position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:11px;line-height:18px;text-align:center;border:0}
.addshot{width:64px;height:64px;border-radius:8px;border:1.5px dashed #C8D4CE;background:#fff;color:#9AA8A1;font-size:22px;display:flex;align-items:center;justify-content:center}

/* 定位 */
.geo{display:flex;align-items:center;gap:8px;padding:10px;background:#F1F5F3;border-radius:8px;font-size:12.5px;color:#5A6B63}
.geo b{color:#1F2A24}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dot.g{background:#2FA84F}.dot.y{background:#E8A33D}.dot.r{background:#C0392B}.dot.n{background:#C8D4CE}

/* 列表 */
.item{background:#fff;border-radius:12px;margin-bottom:10px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.src{background:#EAF1ED;padding:10px 14px;font-size:13px;font-weight:600;color:#2F5D50;display:flex;justify-content:space-between}
.src small{font-weight:400;color:#6B7C74}
.rec{padding:12px 14px;border-top:1px solid #F3F6F4}
.rec:first-child{border-top:0}
.rec .l1{display:flex;justify-content:space-between;align-items:baseline}
.rec .nm{font-size:15px;font-weight:600}
.rec .amt{font-size:16px;font-weight:700;color:#C0392B}
.rec .l2{font-size:12px;color:#7A8A82;margin-top:4px}
.rec .l3{font-size:12px;color:#9AA8A1;margin-top:3px}
.empty{text-align:center;color:#B9C4BE;font-size:13px;padding:30px 0}

/* 三色卡 */
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}
.tc{border-radius:13px;padding:13px 8px 12px;text-align:center}
.tc .t{font-size:10.5px;font-weight:700;margin-bottom:8px}
.tc .big{font-size:15px;font-weight:800;line-height:1.15}
.tc .u{font-size:9.5px;opacity:.7;margin:2px 0 8px}
.tc .line{display:flex;justify-content:space-between;font-size:9.5px;padding:3px 0}
.tc .sep{height:1px;background:currentColor;opacity:.18;margin:5px 0}
.tc.c1{background:#FFF6EC;color:#8A5A1E}
.tc.c2{background:#E3F0EA;color:#1E4A3C}
.tc.c3{background:#2F5D50;color:#fff}

/* 关联 */
.link-card{background:#fff;border-radius:12px;padding:13px 14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.link-card .h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.link-card .who{font-size:14.5px;font-weight:600}
.link-card .st{font-size:11px;padding:2px 8px;border-radius:20px}
.st.on{background:#E3F0EA;color:#1E4A3C}
.st.off{background:#F5F5F5;color:#9AA8A1}
.link-card .meta{font-size:11.5px;color:#9AA8A1;line-height:1.7}

/* 审批 */
.ap{background:#fff;border-radius:12px;padding:13px 14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.ap .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.ap .who{font-size:14px;font-weight:600}
.ap .tag{font-size:11px;padding:2px 8px;border-radius:20px;background:#FFF6EC;color:#8A5A1E}
.ap .body{font-size:12.5px;color:#5A6B63;line-height:1.7;background:#F8FAF9;padding:9px;border-radius:8px;margin-bottom:10px}
.ap .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* 底部导航 */
.tabbar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #E3E8E5;display:flex;padding-bottom:env(safe-area-inset-bottom)}
.tabbar button{flex:1;padding:10px 0 12px;border:0;background:none;font-size:11px;color:#8A9994}
.tabbar button.on{color:#2F5D50;font-weight:700}
.tabbar button i{display:block;font-size:19px;font-style:normal;margin-bottom:2px}

.toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.8);color:#fff;padding:13px 20px;border-radius:10px;font-size:14px;z-index:999;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>

<!-- 登录 -->
<div id="login">
  <h1>生姜收购台账</h1>
  <p>Demo 版 · 数据只存在本机浏览器<br>邀请码随便输，比如 <b>GL-7K3M</b></p>
  <input id="code" placeholder="邀请码" value="GL-7K3M">
  <button onclick="doLogin()">进 入</button>
  <div class="tip2">这是原型，可以随便点、随便改<br>刷新不会丢数据</div>
</div>

<!-- 主界面 -->
<div id="app" class="hide">
  <header>
    <span class="t">生姜收购台账</span>
    <select id="who" onchange="switchUser(this.value)"></select>
  </header>

  <nav id="tabs">
    <button class="on" data-tab="in">录入</button>
    <button data-tab="list">明细</button>
    <button data-tab="sum">汇总</button>
    <button data-tab="link">关联</button>
    <button data-tab="ap">审批 <span id="apBadge" class="pill hide">0</span></button>
  </nav>

  <main>
    <!-- 录入 -->
    <section id="tab-in">
      <div class="card">
        <h3>客户（买家）</h3>
        <div class="mb">
          <label>客户名称</label>
          <input id="cusName" list="dlCus" placeholder="输入或选择" oninput="matchCustomer()">
          <datalist id="dlCus"></datalist>
          <div class="hint" id="cusHint"></div>
        </div>
        <div class="row">
          <div><label>客户电话</label><input id="cusTel" placeholder="手机号"></div>
          <div><label>批号</label><input id="lot" placeholder="20250217-01"></div>
        </div>
        <div class="mb">
          <label>客户合同（最多 5 张）</label>
          <div class="shots" id="cusShots"></div>
        </div>
      </div>

      <div class="card">
        <h3>货主（卖家）</h3>
        <div class="row">
          <div><label>货主</label><input id="ownName" list="dlOwn" placeholder="输入或选择"><datalist id="dlOwn"></datalist></div>
          <div><label>电话</label><input id="ownTel" placeholder="手机号"></div>
        </div>
        <div class="mb"><label>基地</label><input id="base" placeholder="王家村基地"></div>
        <div class="mb">
          <label>货主合同（最多 5 张）</label>
          <div class="shots" id="ownShots"></div>
        </div>
      </div>

      <div class="card">
        <h3>计量与价格</h3>
        <div class="row">
          <div><label>件数</label><input id="jian" type="number" inputmode="decimal" value="0" oninput="recalc()"></div>
          <div><label>单件斤数</label><input id="per" type="number" inputmode="decimal" value="0" oninput="recalc()"></div>
        </div>
        <div class="row">
          <div><label>扣土率 %</label><input id="soil" type="number" inputmode="decimal" value="10" oninput="recalc()"></div>
          <div><label>单价（元/斤）</label><input id="price" type="number" inputmode="decimal" value="0" oninput="recalc()"></div>
        </div>
        <div class="row">
          <div><label>代办费（元/斤）</label><input id="fee" type="number" inputmode="decimal" value="0.05" oninput="recalc()"></div>
          <div><label>收购日期</label><input id="date" type="text" readonly></div>
        </div>
        <div class="hint" id="calcHint" style="font-size:13px;color:#2F5D50;padding:6px 0"></div>
      </div>

      <div class="card">
        <h3>收购地点 <span class="pill" id="geoState">未定位</span></h3>
        <div class="mb">
          <div class="geo" id="geoBox">
            <span class="dot n" id="geoDot"></span>
            <span id="geoText">点下面按钮获取位置</span>
          </div>
        </div>
        <button class="btn ghost sm" onclick="locate()">📍 获取当前位置</button>
        <div class="mb" style="margin-top:10px">
          <label>地址（可手动修改）</label>
          <input id="addr" placeholder="山东省潍坊市安丘市XX镇XX村">
        </div>
        <div class="mb">
          <label>本单合同（最多 5 张）</label>
          <div class="shots" id="recShots"></div>
        </div>
      </div>

      <button class="btn" onclick="saveRecord()">保 存</button>
      <p class="hint" style="text-align:center;padding:14px 0">Demo：数据存本机，可在「明细」里看到</p>
    </section>

    <!-- 明细 -->
    <section id="tab-list" class="hide"><div id="listBox"></div></section>

    <!-- 汇总 -->
    <section id="tab-sum" class="hide">
      <div class="card" style="padding:14px"><div class="three" id="sumBox"></div></div>
      <div class="card"><h3>按来源</h3><div id="srcBox"></div></div>
    </section>

    <!-- 关联 -->
    <section id="tab-link" class="hide">
      <div class="card">
        <h3>我的关联线</h3>
        <div id="linkBox"></div>
      </div>
      <div class="card">
        <h3>新建关联</h3>
        <div class="mb"><label>邀请谁</label><select id="linkWho"></select></div>
        <div class="mb"><label>方向</label>
          <select id="linkDir">
            <option value="a2b">我看他的账</option>
            <option value="b2a">他看我的账</option>
            <option value="both">互相看</option>
          </select>
        </div>
        <div class="mb"><label>看哪些</label>
          <select id="linkScope">
            <option value="all">全部数据</option>
            <option value="hide">全部数据，但隐藏金额</option>
          </select>
        </div>
        <button class="btn" onclick="addLink()">生成邀请码并关联</button>
      </div>
    </section>

    <!-- 审批 -->
    <section id="tab-ap" class="hide"><div id="apBox"></div></section>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============ 数据层 ============ */
const DBKEY = 'ginger_demo_v1';
let S = null;

function defaultState(){
  const now = Date.now();
  return {
    users: [
      {id:'u1', name:'老王（平台）', type:'platform'},
      {id:'u2', name:'小张', type:'normal'},
      {id:'u3', name:'小赵', type:'normal'}
    ],
    me: 'u2',
    customers: [
      {id:'c1', ownerId:'u2', name:'山东姜业公司', tel:'13500001111', address:'山东省潍坊市', contracts:[]},
      {id:'c2', ownerId:'u2', name:'江苏调味品厂', tel:'13600002222', address:'江苏省徐州市', contracts:[]}
    ],
    owners: [
      {id:'o1', ownerId:'u2', name:'张建国', tel:'13900001111', base:'王家村基地', contracts:[]}
    ],
    records: [
      {id:'r1', ownerId:'u2', creatorId:'u2', customerId:'c1', ownerRefId:'o1',
       date:'2026-11-22', lot:'20250217-01', plate:'鲁A12345',
       jian:120, per:50, soil:.1, price:1.2, fee:.05,
       total:6000, soilQty:600, net:5400, amount:6480, feeTotal:270, actual:6750,
       address:'山东省潍坊市安丘市王家村', lat:36.48, lng:119.12, accuracy:18,
       contracts:[], linkedTo:null, createdAt:now-86400000}
    ],
    expenses: [],
    links: [
      {id:'l1', aId:'u1', bId:'u2', direction:'a2b', scope:{hideFields:[]}, status:'active'}
    ],
    approvals: []
  };
}

function load(){
  try{
    const raw = localStorage.getItem(DBKEY);
    S = raw ? JSON.parse(raw) : defaultState();
  }catch(e){ S = defaultState(); }
}
function save(){ localStorage.setItem(DBKEY, JSON.stringify(S)); }
function me(){ return S.users.find(u => u.id === S.me); }
function userById(id){ return S.users.find(u => u.id === id); }

/* ============ 工具 ============ */
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 1600);
}
function fmt(n, d){
  if(d === undefined) d = 2;
  const f = Math.pow(10, d);
  const s = (Math.round((n||0)*f)/f).toFixed(d);
  const p = s.split('.');
  p[0] = p[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return p.join('.');
}
function todayStr(){ return new Date().toISOString().slice(0,10); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ============ 登录 / 身份 ============ */
function doLogin(){
  const code = document.getElementById('code').value.trim();
  if(!code){ toast('请输入邀请码'); return; }
  load();
  document.getElementById('login').classList.add('hide');
  document.getElementById('app').classList.remove('hide');
  buildUserSelect();
  buildLinkOptions();
  switchUser(S.me);
  toast('已进入 Demo');
}

function buildUserSelect(){
  const sel = document.getElementById('who');
  sel.innerHTML = S.users.map(u =>
    `<option value="${u.id}" ${u.id===S.me?'selected':''}>${esc(u.name)}${u.type==='platform'?' · 平台':''}</option>`
  ).join('');
}

function switchUser(id){
  S.me = id; save();
  buildUserSelect();
  renderAll();
  toast('当前身份：' + me().name);
}

function buildLinkOptions(){
  const sel = document.getElementById('linkWho');
  if(!sel) return;
  sel.innerHTML = S.users.filter(u => u.id !== S.me)
    .map(u => `<option value="${u.id}">${esc(u.name)}</option>`).join('');
}

/* ============ Tab ============ */
document.getElementById('tabs').addEventListener('click', e => {
  const b = e.target.closest('button[data-tab]');
  if(!b) return;
  showTab(b.dataset.tab);
});
function showTab(name){
  ['in','list','sum','link','ap'].forEach(k => {
    document.getElementById('tab-'+k).classList.toggle('hide', k !== name);
    const btn = document.querySelector(`#tabs button[data-tab="${k}"]`);
    if(btn) btn.classList.toggle('on', k === name);
  });
  if(name === 'list') renderList();
  if(name === 'sum') renderSum();
  if(name === 'link') renderLinks();
  if(name === 'ap') renderApprovals();
}

/* ============ 客户匹配 ============ */
function matchCustomer(){
  const v = document.getElementById('cusName').value.trim();
  const hit = S.customers.find(c => c.name === v);
  const hint = document.getElementById('cusHint');
  if(!v){ hint.textContent = ''; return; }
  if(hit){
    hint.innerHTML = `<span style="color:#1E4A3C">✓ 已匹配档案：${esc(hit.name)}</span>`;
    if(hit.tel) document.getElementById('cusTel').value = hit.tel;
    renderShots('cusShots', hit.contracts || []);
  }else{
    hint.innerHTML = `<span style="color:#8A5A1E">保存时自动新建客户档案</span>`;
  }
}

/* ============ 合同上传（真实压缩） ============ */
let shotStore = {cus:[], own:[], rec:[]};

function renderShots(boxId, list){
  const box = document.getElementById(boxId);
  const key = boxId === 'cusShots' ? 'cus' : boxId === 'ownShots' ? 'own' : 'rec';
  shotStore[key] = list.slice();
  box.innerHTML = '';
  list.forEach((src, i) => {
    const d = document.createElement('div');
    d.className = 'shot';
    d.innerHTML = `<img src="${src}"><button class="x" onclick="delShot('${key}',${i})">×</button>`;
    box.appendChild(d);
  });
  if(list.length < 5){
    const a = document.createElement('label');
    a.className = 'addshot';
    a.textContent = '+';
    const inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = 'image/*';
    inp.style.display = 'none';
    inp.onchange = function(ev){ addShot(ev, key); };
    a.appendChild(inp);
    box.appendChild(a);
  }
}

function addShot(e, key){
  const file = e.target.files[0];
  if(!file) return;
  if(shotStore[key].length >= 5){ toast('最多 5 张'); return; }
  const before = file.size;
  compress(file, (dataUrl, size) => {
    shotStore[key].push(dataUrl);
    const boxId = key === 'cus' ? 'cusShots' : key === 'own' ? 'ownShots' : 'recShots';
    renderShots(boxId, shotStore[key]);
    toast(`已压缩 ${(before/1024).toFixed(0)}KB → ${(size/1024).toFixed(0)}KB`);
  });
  e.target.value = '';
}

function delShot(key, i){
  shotStore[key].splice(i, 1);
  const boxId = key === 'cus' ? 'cusShots' : key === 'own' ? 'ownShots' : 'recShots';
  renderShots(boxId, shotStore[key]);
}

function compress(file, cb){
  const img = new Image();
  const url = URL.createObjectURL(file);
  img.onload = () => {
    const MAX = 1600;
    let w = img.width, h = img.height;
    if(w > h && w > MAX){ h = h * MAX / w; w = MAX; }
    else if(h >= w && h > MAX){ w = w * MAX / h; h = MAX; }
    const cv = document.createElement('canvas');
    cv.width = w; cv.height = h;
    cv.getContext('2d').drawImage(img, 0, 0, w, h);
    const out = cv.toDataURL('image/jpeg', 0.75);
    URL.revokeObjectURL(url);
    cb(out, Math.round(out.length * 0.75));
  };
  img.src = url;
}

/* ============ 定位 ============ */
let geo = {lat:null, lng:null, acc:null};

function locate(){
  const st = document.getElementById('geoState');
  const dot = document.getElementById('geoDot');
  const txt = document.getElementById('geoText');
  st.textContent = '定位中…';
  if(!navigator.geolocation){ toast('此浏览器不支持定位'); return; }
  navigator.geolocation.getCurrentPosition(pos => {
    geo.lat = +pos.coords.latitude.toFixed(6);
    geo.lng = +pos.coords.longitude.toFixed(6);
    geo.acc = Math.round(pos.coords.accuracy);
    const lvl = geo.acc <= 30 ? 'g' : geo.acc <= 200 ? 'y' : 'r';
    const word = geo.acc <= 30 ? '精准' : geo.acc <= 200 ? '一般' : '偏差较大';
    dot.className = 'dot ' + lvl;
    txt.innerHTML = `纬度 <b>${geo.lat}</b> · 经度 <b>${geo.lng}</b><br>精度 ±${geo.acc} 米（${word}）`;
    st.textContent = '已定位';
    if(!document.getElementById('addr').value){
      document.getElementById('addr').value = `已定位（${geo.lat}, ${geo.lng}）`;
    }
    toast('定位成功 ±' + geo.acc + '米');
  }, err => {
    dot.className = 'dot r';
    st.textContent = '定位失败';
    txt.textContent = '定位失败，请手动填写地址';
    toast('定位失败：' + (err.code === 1 ? '未授权' : '超时'));
  }, {enableHighAccuracy:true, timeout:8000, maximumAge:0});
}

/* ============ 计算 ============ */
function recalc(){
  const jian = +document.getElementById('jian').value || 0;
  const per = +document.getElementById('per').value || 0;
  const soil = (+document.getElementById('soil').value || 0) / 100;
  const price = +document.getElementById('price').value || 0;
  const fee = +document.getElementById('fee').value || 0;
  const total = jian * per;
  const soilQty = total * soil;
  const net = total - soilQty;
  const amount = net * price;
  const feeTotal = net * fee;
  const actual = amount + feeTotal;
  document.getElementById('calcHint').innerHTML =
    `总斤数 ${fmt(total,0)} · 扣土 ${fmt(soilQty,0)} · 净重 ${fmt(net,0)}　` +
    `总价 ¥${fmt(amount,0)} · 代办 ¥${fmt(feeTotal,0)} · <b>总款 ¥${fmt(actual,0)}</b>`;
  return {total, soilQty, net, amount, feeTotal, actual};
}

/* ============ 保存记录 ============ */
function saveRecord(){
  const cusName = document.getElementById('cusName').value.trim();
  if(!cusName){ toast('请填客户'); return; }
  const ownName = document.getElementById('ownName').value.trim();
  if(!ownName){ toast('请填货主'); return; }
  const c = recalc();
  if(c.total <= 0){ toast('件数和单件斤数要大于 0'); return; }

  // 客户档案：匹配或新建
  let cus = S.customers.find(x => x.name === cusName && x.ownerId === S.me);
  if(!cus){
    cus = {id:'c'+Date.now(), ownerId:S.me, name:cusName,
           tel:document.getElementById('cusTel').value, address:'', contracts:shotStore.cus.slice()};
    S.customers.push(cus);
  }else{
    cus.tel = document.getElementById('cusTel').value || cus.tel;
    cus.contracts = shotStore.cus.slice();
  }

  // 货主档案
  let own = S.owners.find(x => x.name === ownName && x.ownerId === S.me);
  if(!own){
    own = {id:'o'+Date.now(), ownerId:S.me, name:ownName,
           tel:document.getElementById('ownTel').value,
           base:document.getElementById('base').value, contracts:shotStore.own.slice()};
    S.owners.push(own);
  }else{
    own.tel = document.getElementById('ownTel').value || own.tel;
    own.base = document.getElementById('base').value || own.base;
    own.contracts = shotStore.own.slice();
  }

  const now = Date.now();
  const rec = {
    id: 'r' + now, ownerId: S.me, creatorId: S.me,
    customerId: cus.id, ownerRefId: own.id,
    date: document.getElementById('date').value || todayStr(),
    lot: document.getElementById('lot').value,
    plate: '',
    jian: +document.getElementById('jian').value,
    per: +document.getElementById('per').value,
    soil: (+document.getElementById('soil').value)/100,
    price: +document.getElementById('price').value,
    fee: +document.getElementById('fee').value,
    total: c.total, soilQty: c.soilQty, net: c.net,
    amount: c.amount, feeTotal: c.feeTotal, actual: c.actual,
    address: document.getElementById('addr').value,
    lat: geo.lat, lng: geo.lng, accuracy: geo.acc,
    contracts: shotStore.rec.slice(),
    linkedTo: null, createdAt: now
  };
  S.records.push(rec);
  save();
  toast('已保存 ✓');

  // 清空录入区（保留日期、客户）
  document.getElementById('jian').value = 0;
  document.getElementById('per').value = 0;
  document.getElementById('price').value = 0;
  document.getElementById('lot').value = '';
  document.getElementById('addr').value = '';
  shotStore = {cus:[], own:[], rec:[]};
  renderShots('cusShots', []); renderShots('ownShots', []); renderShots('recShots', []);
  recalc();
  renderAll();
}

/* ============ 可见性 ============ */
function visibleRecords(userId){
  const u = userById(userId);
  if(u && u.type === 'platform') return S.records.map(r => ({...r, _src: r.ownerId === userId ? 'me' : userById(r.ownerId).name, _masked:false}));
  const out = [];
  S.records.filter(r => r.ownerId === userId).forEach(r => out.push({...r, _src:'me', _masked:false}));
  S.links.filter(l => l.status === 'active').forEach(l => {
    let grantor = null;
    if(l.direction === 'a2b' && l.bId === userId) grantor = l.aId;
    if(l.direction === 'b2a' && l.aId === userId) grantor = l.bId;
    if(l.direction === 'both'){ if(l.aId === userId) grantor = l.bId; else if(l.bId === userId) grantor = l.aId; }
    if(!grantor) return;
    const hide = (l.scope.hideFields || []).length > 0;
    S.records.filter(r => r.ownerId === grantor).forEach(r => {
      const copy = {...r, _src: userById(grantor).name, _masked: hide};
      if(hide){ copy.amount = null; copy.feeTotal = null; copy.actual = null; copy.price = null; }
      out.push(copy);
    });
  });
  return out;
}

/* ============ 列表 ============ */
function renderList(){
  const recs = visibleRecords(S.me);
  const box = document.getElementById('listBox');
  if(!recs.length){ box.innerHTML = '<div class="empty">还没有记录</div>'; return; }
  const groups = {};
  recs.forEach(r => { (groups[r._src] = groups[r._src] || []).push(r); });
  let html = '';
  Object.keys(groups).forEach(src => {
    const list = groups[src];
    const sum = list.reduce((a,b) => a + (b.actual || 0), 0);
    html += `<div class="item"><div class="src">
      <span>${src === 'me' ? '我的账' : '来自 ' + esc(src)}</span>
      <small>${list.length} 笔 · ¥${fmt(sum,0)}</small></div>`;
    list.sort((a,b) => b.createdAt - a.createdAt).forEach(r => {
      const cus = S.customers.find(c => c.id === r.customerId);
      const own = S.owners.find(o => o.id === r.ownerRefId);
      html += `<div class="rec">
        <div class="l1"><span class="nm">${esc(cus?cus.name:'—')}</span>
          <span class="amt">${r._masked ? '¥ ***' : '¥' + fmt(r.actual,0)}</span></div>
        <div class="l2">${r.date} · ${fmt(r.net,0)} 斤 · ${esc(own?own.name:'—')}</div>
        <div class="l3">${r.address ? '📍 ' + esc(r.address) : ''}${r.contracts && r.contracts.length ? ' · 合同' + r.contracts.length + '张' : ''}</div>
      </div>`;
    });
    html += '</div>';
  });
  box.innerHTML = html;
}

/* ============ 汇总 ============ */
function renderSum(){
  const recs = visibleRecords(S.me);
  const today = todayStr(), ym = today.slice(0,7);
  function stat(key){
    const f = r => key === 'today' ? r.date === today : key === 'month' ? String(r.date).slice(0,7) === ym : true;
    const rs = recs.filter(f);
    const cost = rs.reduce((a,b) => a + (b._masked ? 0 : (b.actual||0)), 0);
    const net = rs.reduce((a,b) => a + (b.net||0), 0);
    return {cost, net, n: rs.length};
  }
  const arr = [
    {k:'今日', c:'c1', d:stat('today')},
    {k:'本月', c:'c2', d:stat('month')},
    {k:'累计', c:'c3', d:stat('all')}
  ];
  document.getElementById('sumBox').innerHTML = arr.map(p => `
    <div class="tc ${p.c}">
      <div class="t">${p.k}</div>
      <div class="big">${fmt(p.d.cost,0)}</div>
      <div class="u">总款</div>
      <div class="sep"></div>
      <div class="line"><span>笔数</span><b>${p.d.n}</b></div>
      <div class="line"><span>净重</span><b>${fmt(p.d.net,0)}</b></div>
    </div>`).join('');

  const groups = {};
  recs.forEach(r => { (groups[r._src] = groups[r._src] || []).push(r); });
  document.getElementById('srcBox').innerHTML = Object.keys(groups).map(src => {
    const list = groups[src];
    const sum = list.reduce((a,b) => a + (b.actual||0), 0);
    return `<div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #F2F5F3;font-size:13.5px">
      <span>${src === 'me' ? '我的账' : '来自 ' + esc(src)}</span>
      <b style="font-variant-numeric:tabular-nums">${list.length} 笔 · ¥${fmt(sum,0)}</b></div>`;
  }).join('') || '<div class="empty">无数据</div>';
}

/* ============ 关联 ============ */
function renderLinks(){
  const box = document.getElementById('linkBox');
  const mine = S.links.filter(l => l.aId === S.me || l.bId === S.me);
  if(!mine.length){ box.innerHTML = '<div class="empty">还没有关联线</div>'; return; }
  box.innerHTML = mine.map(l => {
    const other = l.aId === S.me ? userById(l.bId) : userById(l.aId);
    const dir = l.aId === S.me
      ? (l.direction === 'a2b' ? '我看他' : l.direction === 'b2a' ? '他看我' : '互相看')
      : (l.direction === 'b2a' ? '我看他' : l.direction === 'a2b' ? '他看我' : '互相看');
    const hide = (l.scope.hideFields||[]).length > 0;
    return `<div class="link-card">
      <div class="h"><span class="who">${esc(other?other.name:'—')}</span>
        <span class="st ${l.status==='active'?'on':'off'}">${l.status==='active'?'生效中':'已解除'}</span></div>
      <div class="meta">方向：${dir}<br>范围：全部数据${hide?'（金额隐藏）':''}<br>
        ${l.status==='active'?`<button class="btn ghost sm" style="margin-top:8px" onclick="revokeLink('${l.id}')">解除关联</button>`:''}
      </div></div>`;
  }).join('');
}

function addLink(){
  const who = document.getElementById('linkWho').value;
  const dir = document.getElementById('linkDir').value;
  const scope = document.getElementById('linkScope').value;
  if(!who){ toast('请选择对象'); return; }
  const exist = S.links.find(l => (l.aId===S.me&&l.bId===who)||(l.aId===who&&l.bId===S.me));
  if(exist && exist.status === 'active'){ toast('已经有关联了'); return; }
  S.links.push({
    id:'l'+Date.now(), aId:S.me, bId:who, direction:dir,
    scope:{hideFields: scope === 'hide' ? ['price','amount','feeTotal','actual'] : []},
    status:'active'
  });
  save(); renderLinks(); renderList(); renderSum();
  toast('已生成邀请码 GL-' + Math.random().toString(36).slice(2,6).toUpperCase() + ' 并建立关联');
}

function revokeLink(id){
  const l = S.links.find(x => x.id === id);
  if(!l) return;
  l.status = 'revoked';
  save(); renderLinks(); renderList(); renderSum();
  toast('已解除关联（历史数据保留只读）');
}

/* ============ 审批 ============ */
function renderApprovals(){
  const box = document.getElementById('apBox');
  const mine = S.approvals.filter(a => a.ownerId === S.me);
  const badge = document.getElementById('apBadge');
  const pending = mine.filter(a => a.status === 'pending').length;
  if(pending){ badge.textContent = pending; badge.classList.remove('hide'); }
  else badge.classList.add('hide');

  if(!mine.length){ box.innerHTML = '<div class="empty">没有待审批</div>'; return; }
  box.innerHTML = mine.map(a => {
    const who = userById(a.applicantId);
    const rec = S.records.find(r => r.id === a.recordId);
    const cus = rec ? S.customers.find(c => c.id === rec.customerId) : null;
    return `<div class="ap">
      <div class="top"><span class="who">${esc(who?who.name:'—')} 申请修改</span>
        <span class="tag">${a.status==='pending'?'待审批':a.status==='approved'?'已同意':'已拒绝'}</span></div>
      <div class="body">记录：${esc(cus?cus.name:'—')}（${rec?rec.date:''}）<br>
        理由：${esc(a.reason)}</div>
      ${a.status==='pending'?`<div class="acts">
        <button class="btn sm" onclick="decide('${a.id}','approved')">同意</button>
        <button class="btn ghost sm" onclick="decide('${a.id}','rejected')">拒绝</button>
      </div>`:''}
    </div>`;
  }).join('');
}

function decide(id, st){
  const a = S.approvals.find(x => x.id === id);
  if(!a) return;
  a.status = st;
  a.decidedAt = Date.now();
  save(); renderApprovals(); renderList(); renderSum();
  toast(st === 'approved' ? '已同意' : '已拒绝');
}

/* ============ 初始化 ============ */
function renderAll(){
  buildUserSelect();
  buildLinkOptions();
  renderList();
  renderSum();
  renderLinks();
  renderApprovals();
}

(function init(){
  load();
  document.getElementById('date').value = todayStr();
  renderShots('cusShots', []);
  renderShots('ownShots', []);
  renderShots('recShots', []);
  recalc();
  // 预填 datalist
  const dc = document.getElementById('dlCus'), dlo = document.getElementById('dlOwn');
  dc.innerHTML = S.customers.map(c => `<option value="${esc(c.name)}">`).join('');
  dlo.innerHTML = S.owners.map(o => `<option value="${esc(o.name)}">`).join('');
  // 方便直接进入：demo.html#go
  if(location.hash === '#go'){ setTimeout(doLogin, 60); }
})();
</script>
